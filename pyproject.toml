[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruletrace"
version = "0.1.0"
description = "Check ship designs (3D models, drawings, documents) against SOLAS, MARPOL, COLREG, class rules, PVAG and ADA, and show why something is not compliant."
requires-python = ">=3.10"
dependencies = [
  # Vartija core (prior work), pinned to a release tag. For side-by-side development you can
  # override it afterwards with: pip install -e ../Vartija/vartija-core
  "vartija-core @ git+https://github.com/sahilpimple/Vartija.git@v0.2.0#subdirectory=vartija-core",
  "pyyaml>=6", "fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.27",
  "httpx>=0.27"]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]
drawings = ["pypdfium2>=4"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]
# RuleMate Copilot: cited Q&A over the full regulation texts, Gemini reading of drawings and pictures
copilot = ["pydantic>=2.7", "python-dotenv>=1.0", "numpy>=1.26", "pdfplumber>=0.11", "python-docx>=1.1",
           "beautifulsoup4>=4.12", "rank_bm25>=0.2.2", "sentence-transformers>=3.0", "pint>=0.24", "pillow>=10",
           "rapidocr>=3.0", "onnxruntime>=1.18", "certifi"]

[tool.setuptools.packages.find]
include = ["ruletrace*", "rulemate*"]

[tool.setuptools.package-data]
ruletrace = ["static/*", "rules/*.yaml", "samples/*", "value.yaml", "copilot_rules/*.md", "copilot_rules/*.csv"]
