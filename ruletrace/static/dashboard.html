<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuleTrace · dashboard</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--muted:#5d6975;--line:#dde3e8;--navy:#0b2545;--teal:#138a8a;
--fail:#d64545;--warn:#d88b16;--unknown:#6b7c93;--pass:#2e8b57;--r:10px}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--navy);color:#fff;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}header .sub{color:#b9c7d8;font-size:12px}header .sp{flex:1}
header a{color:#cfe3ff;font-size:13px}header select{font:inherit;border-radius:6px;border:0;padding:4px 6px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}tr.sub td{background:#fafbfc;padding:6px 8px 10px 22px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;white-space:nowrap;display:inline-block}
.pill.fix{background:var(--fail)}.pill.info{background:var(--unknown)}.pill.review{background:var(--warn)}.pill.ready{background:var(--pass)}
.c-fail{color:var(--fail)}.c-warn{color:var(--warn)}.c-unknown{color:var(--unknown)}.c-pass{color:var(--pass)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer}
button.primary{background:var(--teal);border-color:var(--teal);color:#fff}a.btn{font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0}.bar .l{width:170px;font-size:13px}.bar .t{flex:1;background:var(--bg);border-radius:5px;height:14px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--fail)}.bar .n{width:28px;text-align:right;font-variant-numeric:tabular-nums}
.chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:8px;margin-bottom:10px}
.chain.ok{background:#e8f5ee;color:#1d6b43}.chain.bad{background:#fbeaea;color:#a12a2a}
.act{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hero{font-size:22px;font-weight:600;margin:4px 0 14px}.hero span{color:var(--teal)}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0}
.ship{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ship b{flex:1}
.assume label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;margin:5px 0}
.assume input{width:110px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;text-align:right}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
.toast.err{background:var(--fail)}
.lvl{font-size:30px;font-weight:800;letter-spacing:.02em;margin:4px 0}
.lvl.at_risk{color:var(--fail)}.lvl.watch{color:var(--warn)}.lvl.clear{color:var(--pass)}.lvl.none{color:var(--unknown)}
.sig{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:13.5px}.sig i{font-style:normal;width:16px;font-weight:700}
.sig.bad i{color:var(--fail)}.sig.warn i{color:var(--warn)}.sig.good i{color:var(--pass)}
.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:900px){.g4{grid-template-columns:1fr}}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:6px}.spark i{flex:1;min-width:4px;background:var(--fail);border-radius:2px 2px 0 0}
.sub2{margin:-4px 0 14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>RuleTrace</h1><span class="sub">Summary of every ship design checked in RuleTrace</span>
  <span class="sp"></span>
  <label class="small" for="who">Signed in as</label>
  <select id="who"></select>
  <a href="/ruletrace">3D design check</a>
  <a href="/ruletrace/rulesets/page">New rule sets</a>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div id="toast" class="toast"></div>
<script>
const PEOPLE = [{label:"Mikko · design engineer", user:"mikko", roles:"engineer"},
                {label:"Aino · CISO / compliance", user:"aino", roles:"ciso"},
                {label:"Sanna · CEO", user:"sanna", roles:"ceo"},
                {label:"Ella · admin", user:"ella", roles:"admin"}];
const PLAIN = {"SOLAS":"Fire safety and escape (SOLAS)", "SOLAS / FSS Code":"Escape stairs (FSS Code)", "COLREG":"Navigation lights (COLREG)",
  "MARPOL":"Engine emissions (MARPOL)", "MLC 2006":"Crew accommodation (MLC)", "PVAG":"Accessibility, US ports (PVAG)",
  "ADA":"Accessibility, US ports (ADA)", "Drawing consistency":"Drawing consistency", "Load Line":"Deck openings and rails (Load Line)", "SOLAS II-1":"Hull subdivision (SOLAS II-1)"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
PEOPLE.forEach((p,i) => $("#who").insertAdjacentHTML("beforeend", `<option value="${i}">${esc(p.label)}</option>`));
$("#who").value = store.get("ruletrace.dash.who") || "0";
$("#who").onchange = () => { store.set("ruletrace.dash.who", $("#who").value); load(); };
function headers(){ const p = PEOPLE[+$("#who").value]; return {"X-User":p.user, "X-Roles":p.roles, "X-User-Kind":"human"}; }
async function api(path, opts={}){
  const r = await fetch(path, {...opts, headers: headers()});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : `HTTP ${r.status}`);
  return d;
}
function toast(m, err){ const t=$("#toast"); t.textContent=m; t.className="toast"+(err?" err":""); t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none", err?6000:2500); }
const when = ts => { try { return new Date(ts).toLocaleString([], {dateStyle:"short", timeStyle:"short"}) } catch(e){ return ts } };
const plain = r => PLAIN[r] || r;
let S = null, V = null, P = null;

async function load(){
  try { S = await api("/ruletrace/summary"); }
  catch(e){ $("#main").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
  V = {...S.value};
  if (S.view === "compliance") {
    try { P = await api("/ruletrace/posture"); }
    catch(e){ $("#main").innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    complianceView(); return;
  }
  if (!S.designs.length) {
    $("#main").innerHTML = `<div class="card empty">No design has been checked yet.<br><br>
      <a href="/ruletrace">Open the 3D design check</a>, load a sample or upload a GA drawing / IFC model, and it will appear here.</div>`;
    return;
  }
  S.view === "engineer" ? engineerView() : executiveView();
}

// ---------------- engineer view ----------------
function engineerView(){
  const t = S.totals, c = S.chain;
  $("#main").innerHTML = `
  <div class="hero" style="font-size:19px">${t.designs} design${t.designs===1?"":"s"} checked · <span style="color:var(--fail)">${t.open_fail} problem${t.open_fail===1?"":"s"} to fix</span></div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><b class="c-fail">${t.open_fail}</b><span>problems to fix (a rule is broken)</span></div>
    <div class="kpi"><b class="c-unknown">${t.open_unknown}</b><span>can't check yet (the design is missing a value)</span></div>
    <div class="kpi"><b class="c-warn">${t.open_warn}</b><span>worth a second look</span></div>
  </div>
  <div class="card"><h2>Designs</h2>
    <table><thead><tr><th>Design</th><th>Result</th><th class="num">Problems</th><th>Checked</th><th></th></tr></thead>
    <tbody>${S.designs.map((d,i) => `
      <tr><td><b>${esc(d.title)}</b><div class="small muted">${esc(d.ship)}</div></td>
        <td><span class="pill ${d.readiness}">${esc(d.readiness_label)}</span></td>
        <td class="num c-fail"><b>${d.counts.fail||0}</b></td>
        <td class="small">${esc(when(d.checked_at))}<div class="muted">by ${esc(d.checked_by)}</div></td>
        <td class="small" style="white-space:nowrap;text-align:right">${d.fails.length ? `<a href="#" data-x="${i}">Show problems</a> · ` : ""}${d.available ? `<a href="/ruletrace#design=${encodeURIComponent(d.design_id)}"><b>Open in 3D</b></a> · <a href="#" data-rm="${esc(d.design_id)}" class="muted">Remove</a>` : `<span class="muted">removed</span>`}</td></tr>
      <tr class="sub" id="x${i}" style="display:none"><td colspan="5">${d.fails.map(f => `<div><span class="c-fail">●</span> <b>${esc(f.title)}</b> <span class="muted">· ${esc(f.ref)}</span></div>`).join("")}</td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Which rules are broken most</h2>${bars()}</div>
    <div class="card"><h2>Check history</h2>
      <div class="chain ${c.ok ? "ok" : "bad"}"><b>${c.ok ? "✓ Nothing has been changed" : "✗ The history has been changed"}</b>
        <span class="small">${c.ok ? `all ${c.entries} saved records are intact` : "at record #" + c.first_broken_seq}</span></div>
      ${S.activity.slice(0,6).map(a => `<div class="act" style="grid-template-columns:1fr auto"><span><b>${esc(a.actor)}</b> checked ${esc(a.file)}<br><span class="small muted">${esc(when(a.ts))}</span></span>
        <span class="small c-fail">${a.counts.fail||0} problems</span></div>`).join("")}
      <div style="display:flex;gap:8px;margin-top:10px"><button id="verify">Check the history is intact</button><button id="dl">Download for class</button></div>
      <details class="small muted" style="margin-top:8px"><summary>How this works</summary>Every check is saved with a fingerprint (SHA-256) of the design file and of the rules used, and each record is linked to the one before. If anyone edits or deletes a record, the check above turns red.</details>
    </div>
  </div>`;
  document.querySelectorAll("[data-x]").forEach(e => e.onclick = ev => { ev.preventDefault(); const r = $("#x" + e.dataset.x), on = r.style.display === "none";
    r.style.display = on ? "" : "none"; e.textContent = on ? "Hide problems" : "Show problems"; });
  $("#verify").onclick = async () => { try { const r = await api("/ruletrace/audit"); toast(r.chain.ok ? `Intact: all ${r.chain.entries} records unchanged` : `Changed at record #${r.chain.first_broken_seq}`, !r.chain.ok); load(); } catch(e){ toast(e.message, true) } };
  $("#dl").onclick = async () => { try {
    const r = await api("/ruletrace/audit"), a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], {type:"application/json"}));
    a.download = `ruletrace-check-history-${new Date().toISOString().slice(0,10)}.json`; a.click(); } catch(e){ toast(e.message, true) } };
  document.querySelectorAll("[data-rm]").forEach(e => e.onclick = async ev => { ev.preventDefault();
    if (!confirm("Remove this design? Its past checks stay in the history.")) return;
    try { await api(`/ruletrace/designs/${e.dataset.rm}`, {method:"DELETE"}); toast("Design removed"); load(); } catch(err){ toast(err.message, true) } });
}
function bars(){
  if (!S.regimes.length) return `<div class="muted">No rule is broken.</div>`;
  const max = Math.max(...S.regimes.map(g => g.fail));
  return S.regimes.map(g => `<div class="bar" title="${esc(g.rules.map(r => r.title).join(" · "))}"><span class="l">${esc(plain(g.regime))}</span><span class="t"><i style="width:${100*g.fail/max}%"></i></span><span class="n">${g.fail}</span></div>`).join("");
}
// ---------------- compliance view (CISO / compliance lead): the whole organisation in one summary ----------------
const cap = x => x ? x.charAt(0).toUpperCase() + x.slice(1) : x;
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; };
function complianceView(){
  const k = P.kpis, r = P.rating, ai = P.ai, rp = P.rule_pack, c = P.chain || {};
  const pct = v => v == null ? "–" : v + "%";
  const sig = P.signals.length ? P.signals.map(x => `<div class="sig ${x.level}"><i>${x.level === "good" ? "✓" : x.level === "bad" ? "✗" : "!"}</i><span>${esc(x.text)}</span></div>`).join("")
    : `<div class="muted">Nothing needs attention.</div>`;
  const ships = P.ships.length ? `<table><thead><tr><th>Ship</th><th>Design</th><th>Result</th><th class="num">Major</th><th class="num">Minor</th><th class="num">Can't check</th><th>Checked</th></tr></thead><tbody>${
    P.ships.map(d => `<tr><td><b>${esc(d.ship)}</b></td><td class="small muted">${esc(d.title)}</td><td><span class="pill ${esc(d.readiness)}">${esc(d.readiness_label)}</span></td>
      <td class="num ${d.major ? "c-fail" : "muted"}"><b>${d.major}</b></td><td class="num ${d.minor ? "c-warn" : "muted"}">${d.minor}</td>
      <td class="num ${d.unknown ? "c-unknown" : "muted"}">${d.unknown}</td><td class="small">${esc(when(d.checked_at))}<div class="muted">by ${esc(d.checked_by)}</div></td></tr>`).join("")}</tbody></table>`
    : `<div class="muted">No design has been checked yet. Every ship design appears here as soon as an engineer checks it.</div>`;
  const focus = P.focus.length ? P.focus.map(f => `<div class="ship"><b style="font-weight:500">${esc(f.ship)}</b><span class="small c-fail">${f.major} major</span><span class="small c-warn">${f.minor} minor</span></div>`).join("")
    : `<div class="muted">No ship has open issues.</div>`;
  const rec = P.recurring.length ? P.recurring.map(x => `<div class="ship" title="${esc(x.ref)}"><b style="font-weight:500">${esc(x.title)}<div class="small muted" style="font-weight:400">${esc(plain(x.regime))}</div></b>
      <span class="small ${x.systemic ? "c-fail" : "muted"}">${x.systemic ? "on " + x.designs + " designs" : "1 design"}</span></div>`).join("")
    : `<div class="muted">No rule is broken.</div>`;
  const maxF = Math.max(1, ...P.trend.map(t => t.fail));
  const trend = P.trend.length ? `<div class="spark">${P.trend.map(t => `<i title="${esc(t.file)} · ${t.fail} to fix · ${esc(when(t.ts))}" style="height:${Math.max(4, 100 * t.fail / maxF)}%"></i>`).join("")}</div>
      <div class="small muted" style="margin-top:6px">Problems found by each check, oldest on the left (${P.trend.length} check${P.trend.length === 1 ? "" : "s"}).</div>` : `<div class="muted">No checks yet.</div>`;
  const regimes = `<table><thead><tr><th>Rules from</th><th class="num">Rules</th><th class="num">Verified</th><th class="num">Open issues</th><th class="num">Designs affected</th></tr></thead><tbody>${
    P.regimes.map(g => `<tr><td>${esc(plain(g.regime))}</td><td class="num">${g.rules}</td><td class="num ${g.verified < g.rules ? "c-warn" : ""}">${g.verified}</td>
      <td class="num ${g.open_fail ? "c-fail" : "muted"}"><b>${g.open_fail}</b></td><td class="num">${g.designs_affected}</td></tr>`).join("")}</tbody></table>`;
  const aiRows = ai.by_action.filter(a => a.count).map(a => `<div class="ship"><b style="font-weight:500">${esc(a.label)}</b><span>${a.count}</span></div>`).join("")
    || `<div class="muted">The AI helpers have not been used yet.</div>`;
  $("#main").innerHTML = `
  <div class="hero" style="margin-bottom:2px">Good ${greeting()}, ${esc(cap(P.me.name))} 👋</div>
  <div class="sub2">Compliance posture across every ship design checked in RuleTrace.</div>
  <div class="kpis">
    <div class="kpi"><b>${k.designs}</b><span>ship designs checked<br>${k.checks_run} check${k.checks_run === 1 ? "" : "s"} run</span></div>
    <div class="kpi"><b class="c-fail">${k.major_open}</b><span>major issues open</span></div>
    <div class="kpi"><b class="c-warn">${k.minor_open}</b><span>minor issues open</span></div>
    <div class="kpi"><b class="c-unknown">${k.unknown_open}</b><span>checks that could not be decided</span></div>
    <div class="kpi"><b class="c-pass">${pct(k.pass_rate)}</b><span>of decided checks pass</span></div>
  </div>
  <h2>Executive compliance intelligence</h2>
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card" style="margin:0"><h2>Compliance posture</h2><div class="lvl ${esc(r.level)}">${esc(r.label)}</div><div class="small muted">${esc(r.reason)}</div>
      <details class="small muted" style="margin-top:8px"><summary>How is this decided?</summary>${esc(r.rule)}</details></div>
    <div class="card" style="margin:0"><h2>Rule pack</h2><div class="big">${rp.verified}<span class="muted" style="font-size:18px"> of ${rp.rules}</span></div>
      <div class="small muted">rules verified against the official text${rp.unverified ? `<details style="margin-top:6px"><summary>${rp.unverified} not verified yet</summary>${rp.unverified_rules.map(u => `<div>${esc(u.id)}</div>`).join("")}</details>` : ""}</div></div>
    <div class="card" style="margin:0"><h2>Check coverage</h2><div class="big">${pct(k.coverage)}</div><div class="small muted">of rule checks could be decided. The rest need a value the design does not give.</div></div>
    <div class="card" style="margin:0"><h2>History integrity</h2><div class="big ${c.ok === false ? "c-fail" : "c-pass"}">${c.ok === false ? "BROKEN" : "INTACT"}</div>
      <div class="small muted">${c.ok === false ? "The check history has been changed (record #" + esc(c.first_broken_seq) + ")." : "all " + esc(c.entries ?? 0) + " saved records are unchanged."}</div></div>
  </div>
  <div class="card"><h2>What needs your attention</h2>${sig}</div>
  <div class="card"><h2>All designs checked</h2>${ships}</div>
  <div class="grid g3" style="align-items:start">
    <div class="card"><h2>Where to focus first</h2>${focus}</div>
    <div class="card"><h2>Issues that recur across designs</h2>${rec}</div>
    <div class="card"><h2>Trend</h2>${trend}</div>
  </div>
  <div class="grid g2" style="align-items:start">
    <div class="card"><h2>Rule coverage by regulation</h2>${regimes}</div>
    <div class="card"><h2>How AI was used</h2>${aiRows}
      ${ai.explanations ? `<div class="small muted" style="margin-top:8px">${ai.explanations} explanation${ai.explanations === 1 ? "" : "s"} written, ${ai.explanations_fell_back} replaced by the rule's own text because they failed the checks.</div>` : ""}
      <div class="small muted" style="margin-top:8px">${esc(ai.policy)}</div></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px"><button id="verify">Check the history is intact</button><button id="dl" class="primary">Download the compliance record</button></div>`;
  $("#verify").onclick = async () => { try { const a = await api("/ruletrace/audit"); toast(a.chain.ok ? `Intact: all ${a.chain.entries} records unchanged` : `Changed at record #${a.chain.first_broken_seq}`, !a.chain.ok); } catch(e){ toast(e.message, true) } };
  $("#dl").onclick = async () => { try {
    const a = await api("/ruletrace/audit"), l = document.createElement("a");
    l.href = URL.createObjectURL(new Blob([JSON.stringify(a, null, 2)], {type: "application/json"}));
    l.download = `ruletrace-compliance-record-${new Date().toISOString().slice(0, 10)}.json`; l.click(); } catch(e){ toast(e.message, true) } };
}
// ---------------- executive view ----------------
function money(n){ return new Intl.NumberFormat(undefined, {style:"currency", currency: V.currency || "EUR", maximumFractionDigits:0}).format(n); }
function executiveView(){
  const t = S.totals;
  const ready = S.designs.filter(d => d.readiness === "ready" || d.readiness === "review").length;
  $("#main").innerHTML = `
  <div class="hero">${t.designs} ship design${t.designs===1?"":"s"} checked. <span>${t.open_fail} compliance issue${t.open_fail===1?"":"s"}</span> found at design stage, before any steel is cut.</div>
  <div class="grid g3">
    <div class="card"><h2>Money saved by finding issues early</h2><div class="big" id="avoid"></div><div class="small muted" id="avoidTxt"></div></div>
    <div class="card"><h2>Engineer time saved</h2><div class="big" id="hours"></div><div class="small muted" id="hoursTxt"></div></div>
    <div class="card"><h2>Designs ready to go</h2><div class="big">${ready} <span class="muted" style="font-size:18px">of ${t.designs}</span></div>
      <div class="small muted">${t.designs - ready} need${t.designs - ready === 1 ? "s" : ""} design changes or more information first.</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Ships</h2>${S.designs.map(d => `<div class="ship"><b>${esc(d.ship || d.title)}<div class="small muted" style="font-weight:400">${esc(d.title)}</div></b>
      <span class="small">${d.counts.fail ? `${d.counts.fail} to fix` : ""}</span><span class="pill ${d.readiness}">${esc(d.readiness_label)}</span></div>`).join("")}</div>
    <div class="card"><h2>Where the issues are</h2>${S.regimes.length ? S.regimes.map(g => `<div class="ship"><b style="font-weight:500">${esc(plain(g.regime))}</b><span class="c-fail">${g.fail}</span></div>`).join("") : `<div class="muted">No open issues.</div>`}</div>
  </div>
  <details class="card assume"><summary><b>How these money figures are estimated</b> <span class="small muted">(example numbers: change them to see the effect)</span></summary><div style="margin-top:10px">
    <div class="grid g2"><div>
      <label>Fix a major issue at design stage <input data-k="fix_cost_now.major" type="number" min="0"></label>
      <label>Fix a major issue ${esc(V.late_label)} <input data-k="fix_cost_late.major" type="number" min="0"></label>
      <label>Fix a minor issue at design stage <input data-k="fix_cost_now.minor" type="number" min="0"></label>
      <label>Fix a minor issue ${esc(V.late_label)} <input data-k="fix_cost_late.minor" type="number" min="0"></label>
    </div><div>
      <label>Engineer cost per hour <input data-k="hourly_cost" type="number" min="0"></label>
      <label>Minutes to check one rule on one part by hand <input data-k="manual_minutes_per_check" type="number" min="0"></label>
      <div class="small muted" style="margin-top:8px">Placeholder figures for the demo, not the yard's own numbers. Defaults are in <span class="mono">ruletrace/value.yaml</span>.</div>
    </div></div>
  </div></details>`;
  const get = k => k.split(".").reduce((o, p) => (o || {})[p], V), set = (k, v) => { const [a, b] = k.split("."); if (b) V[a] = {...(V[a] || {}), [b]: v}; else V[a] = v; };
  document.querySelectorAll("[data-k]").forEach(i => { i.value = get(i.dataset.k); i.oninput = () => { set(i.dataset.k, +i.value || 0); figures(); }; });
  figures();
}
function figures(){
  const s = S.totals.fail_by_severity, late = V.fix_cost_late || {}, now = V.fix_cost_now || {};
  const lateCost = s.major * (late.major||0) + s.minor * (late.minor||0), nowCost = s.major * (now.major||0) + s.minor * (now.minor||0);
  $("#avoid").textContent = money(Math.max(lateCost - nowCost, 0));
  $("#avoidTxt").textContent = `${s.major} major and ${s.minor} minor issues: about ${money(nowCost)} to fix now, instead of about ${money(lateCost)} if found ${V.late_label}.`;
  const h = S.totals.findings_checked * (V.manual_minutes_per_check||0) / 60;
  $("#hours").textContent = `${Math.round(h)} h`;
  $("#hoursTxt").textContent = `${S.totals.findings_checked} rule checks done automatically, worth about ${money(h * (V.hourly_cost||0))} of engineering time.`;
}
load();
</script>
</body>
</html>
